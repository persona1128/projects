<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一个轻松的游戏 by ChrisChi</title><link rel="stylesheet" href="style.css"></head><body>
