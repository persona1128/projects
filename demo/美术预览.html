<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一个轻松的游戏 · 美术预览</title><style>*{box-sizing:border-box}body{font:15px/1.7 system-ui,sans-serif;color:#384c43;background:#f4f2e8;margin:0;padding:32px;max-width:1400px;margin:auto}a{color:#527c69}h1{font-size:26px}h2{font-size:19px;margin-top:35px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px}figure{margin:0;padding:16px;background:#e6ecdd;border:1px solid #cdd8c7;border-radius:12px;text-align:center}img{display:block;width:100%;height:300px;object-fit:contain}figcaption{font-size:13px;color:#6c796a}.enemies img{height:150px}.sprites img{height:185px}.sprites{max-width:580px}.note{font-size:13px;color:#7b8878}button{border:1px solid #aabdaa;background:#e0e8d7;padding:8px 18px;border-radius:5px;color:inherit;cursor:pointer}</style><h1>一个轻松的游戏 · 美术预览</h1><p><a href="index.html">进入试玩 →</a></p><h2>角色立绘</h2><div class="grid" id="portraits"></div><h2>敌人辨识</h2><div class="grid enemies" id="enemies"></div><h2>四帧动作循环</h2><p class="note">沙奈朵展示持续行走；喷火龙展示循环待机。游戏中沙奈朵停下时会保持站立帧。</p><p><button id="toggle">暂停动画</button></p><div class="grid sprites" id="sprites"></div><h2>笔记本封面</h2><div class="grid sprites" id="notebook"></div><script src="config.js"></script><script>
const names={gardevoir:'沙奈朵',ralts:'拉鲁拉丝',charizard:'喷火龙',green:'绿史莱姆',red:'红史莱姆 · 佩剑',bat:'小蝙蝠',king:'蝙蝠王 · 王冠',boss:'巨金怪 · 重装'};
function card(id,src,label){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=src;img.alt=label;caption.textContent=label;figure.append(img,caption);document.getElementById(id).append(figure);return img;}
for(const [who,moods] of Object.entries(CONFIG.assets.portraits))for(const [mood,src]of Object.entries(moods))card('portraits',src,names[who]+' · '+(mood==='calm'?'平静':'开心'));
for(const [who,src]of Object.entries(CONFIG.assets.enemies))card('enemies',src,names[who]);
const animations=Object.entries(CONFIG.assets.sprites).map(([who,frames])=>({who,frames,img:card('sprites',frames[0],names[who])}));
card('notebook',CONFIG.assets.props.notebookClosed,'合上的笔记本 · 空白封面标签');
let paused=false,elapsed=0,last=0;document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'播放动画':'暂停动画'};
function loop(t){if(!paused)elapsed+=Math.min((t-last)/1000,.05);last=t;for(const a of animations){const frame=Math.floor(elapsed*(a.who==='gardevoir'?9:7))%a.frames.length;if(frame!==a.frame){a.img.src=a.frames[frame];a.frame=frame;}}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
